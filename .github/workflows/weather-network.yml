name: Weather network tests

on:
  push:
    branches: [omega]
  pull_request:
    branches: [omega]

permissions:
  contents: read

jobs:
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests future
      - run: python -m unittest discover -s tests -v
